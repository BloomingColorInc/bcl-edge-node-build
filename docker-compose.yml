services:
  db:
    profiles:
      - local-stack
    image: ${MARIADB_IMAGE:-mariadb:10.11.16}
    container_name: librenms-db
    restart: unless-stopped
    command:
      - mysqld
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
    environment:
      TZ: ${TZ:-America/Chicago}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_NAME:-librenms}
      MARIADB_USER: ${DB_USER:-librenms}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - librenms-db:/var/lib/mysql

  redis:
    profiles:
      - local-stack
    image: ${REDIS_IMAGE:-redis:7.4.8-alpine}
    container_name: librenms-redis
    restart: unless-stopped

  librenms:
    profiles:
      - local-stack
    build:
      context: .
      dockerfile: Dockerfile.librenms
      args:
        LIBRENMS_BASE_IMAGE: ${LIBRENMS_BASE_IMAGE:-librenms/librenms:26.3.1@sha256:822798a9d7fd033db5e22d6bc51d3d2db31a03d960ae8685f8692ab7a5e701e3}
        NRPE_PLUGIN_VERSION: ${NRPE_PLUGIN_VERSION:-4.1.1-r0}
    image: ${LIBRENMS_IMAGE:-bcl-librenms:26.3.1-nrpe}
    container_name: librenms
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-America/Chicago}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-librenms}
      DB_USER: ${DB_USER:-librenms}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      RRDCACHED: ${LIBRENMS_RRDCACHED_ENDPOINT:?Set LIBRENMS_RRDCACHED_ENDPOINT to the central Triad RRDCached host:port}
    volumes:
      - librenms-data:/data

  dispatcher:
    profiles:
      - local-stack
    build:
      context: .
      dockerfile: Dockerfile.librenms
      args:
        LIBRENMS_BASE_IMAGE: ${LIBRENMS_BASE_IMAGE:-librenms/librenms:26.3.1@sha256:822798a9d7fd033db5e22d6bc51d3d2db31a03d960ae8685f8692ab7a5e701e3}
        NRPE_PLUGIN_VERSION: ${NRPE_PLUGIN_VERSION:-4.1.1-r0}
    image: ${LIBRENMS_IMAGE:-bcl-librenms:26.3.1-nrpe}
    container_name: librenms-dispatcher
    restart: unless-stopped
    depends_on:
      - librenms
      - db
      - redis
    environment:
      TZ: ${TZ:-America/Chicago}
      SIDECAR_DISPATCHER: "1"
      DISPATCHER_NODE_ID: dispatcher1
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-librenms}
      DB_USER: ${DB_USER:-librenms}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      RRDCACHED: ${LIBRENMS_RRDCACHED_ENDPOINT:?Set LIBRENMS_RRDCACHED_ENDPOINT to the central Triad RRDCached host:port}
    volumes:
      - librenms-data:/data

volumes:
  librenms-data:
  librenms-db: